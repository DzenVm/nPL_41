<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" role="img" aria-labelledby="t3 d3">
  <title id="t3">Łańcuch logistyczny</title>
  <desc id="d3">Diagram trasy surowca od złoża, przez punkt przeładunku w porcie, do magazynu głównego.</desc>

  <rect width="720" height="600" fill="#f5f7fa"/>

  <g stroke="#172a40" stroke-opacity="0.06">
    <path d="M0 100 H720 M0 500 H720"/>
  </g>

  <!-- connecting path -->
  <path d="M150 300 C 260 220, 320 220, 360 300 S 460 380, 570 300" fill="none" stroke="#934527" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round"/>
  <path d="M566 292 l16 8 -4 18 z" fill="#934527"/>

  <!-- node 1: złoże -->
  <g transform="translate(150,300)">
    <circle r="70" fill="#c5dcec" stroke="#245581" stroke-width="3"/>
    <g fill="#245581">
      <rect x="-26" y="-6" width="16" height="28" rx="2"/>
      <rect x="-4" y="-20" width="16" height="42" rx="2"/>
      <rect x="18" y="-2" width="16" height="24" rx="2"/>
    </g>
    <text x="0" y="98" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#172a40">Złoże</text>
    <text x="0" y="122" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#52677c">wydobycie surowca</text>
  </g>

  <!-- node 2: port -->
  <g transform="translate(360,300)">
    <circle r="78" fill="#3476a9" stroke="#245581" stroke-width="3"/>
    <g fill="#e9eff5">
      <path d="M-32 6 h64 l-8 20 h-48 z"/>
      <rect x="-6" y="-26" width="12" height="34"/>
      <path d="M6 -26 l24 10 -24 10 z"/>
    </g>
    <text x="0" y="106" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#172a40">Port</text>
    <text x="0" y="130" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#52677c">punkt przeładunku</text>
  </g>

  <!-- node 3: magazyn -->
  <g transform="translate(570,300)">
    <circle r="70" fill="#c77446" stroke="#97512e" stroke-width="3"/>
    <g fill="#172a40">
      <path d="M-30 -8 l30 -18 30 18 z" opacity="0.85"/>
      <rect x="-30" y="-8" width="60" height="34"/>
      <rect x="-6" y="6" width="12" height="20" fill="#e9eff5"/>
    </g>
    <text x="0" y="98" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#172a40">Magazyn</text>
    <text x="0" y="122" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#52677c">składowanie i dystrybucja</text>
  </g>

  <text x="360" y="540" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#8293a4">
    jedna trasa = jedna decyzja o priorytecie w każdym cyklu
  </text>
</svg>
