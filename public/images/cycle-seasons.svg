<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="t4 d4">
  <title id="t4">Cykl czterech pór roku</title>
  <desc id="d4">Kołowy diagram czterech pór roku wpływających na wydajność pól, kamieniołomów i portu.</desc>

  <rect width="640" height="640" fill="#faf6ec"/>

  <g transform="translate(320,320)">
    <circle r="230" fill="none" stroke="#16211c" stroke-opacity="0.12" stroke-width="1.5"/>

    <path d="M0 0 L0 -230 A230 230 0 0 1 230 0 Z" fill="#2f8577" opacity="0.85"/>
    <path d="M0 0 L230 0 A230 230 0 0 1 0 230 Z" fill="#d9a13e" opacity="0.9"/>
    <path d="M0 0 L0 230 A230 230 0 0 1 -230 0 Z" fill="#c17045" opacity="0.85"/>
    <path d="M0 0 L-230 0 A230 230 0 0 1 0 -230 Z" fill="#a9d0c6" opacity="0.9"/>

    <g stroke="#faf6ec" stroke-width="4">
      <line x1="0" y1="0" x2="0" y2="-230"/>
      <line x1="0" y1="0" x2="230" y2="0"/>
      <line x1="0" y1="0" x2="0" y2="230"/>
      <line x1="0" y1="0" x2="-230" y2="0"/>
    </g>

    <circle r="86" fill="#faf6ec" stroke="#16211c" stroke-opacity="0.14" stroke-width="1.5"/>

    <!-- arrows showing rotation -->
    <g fill="none" stroke="#16211c" stroke-opacity="0.35" stroke-width="2.4">
      <path d="M100 -170 A 205 205 0 0 1 170 -100"/>
      <path d="M170 100 A 205 205 0 0 1 100 170"/>
      <path d="M-100 170 A 205 205 0 0 1 -170 100"/>
      <path d="M-170 -100 A 205 205 0 0 1 -100 -170"/>
    </g>

    <!-- icons -->
    <g transform="translate(-115,-115)" fill="#16211c">
      <path d="M0 14 C -10 4 -10 -8 0 -18 C 10 -8 10 4 0 14 Z" opacity="0.75"/>
      <line x1="0" y1="14" x2="0" y2="24" stroke="#16211c" stroke-width="2"/>
    </g>
    <g transform="translate(115,-115)" fill="#16211c">
      <circle r="12" opacity="0.75"/>
      <g stroke="#16211c" stroke-width="2">
        <line x1="0" y1="-20" x2="0" y2="-28"/>
        <line x1="0" y1="20" x2="0" y2="28"/>
        <line x1="-20" y1="0" x2="-28" y2="0"/>
        <line x1="20" y1="0" x2="28" y2="0"/>
      </g>
    </g>
    <g transform="translate(115,115)" fill="#16211c">
      <path d="M0 -16 C 10 -10 12 4 0 18 C -12 4 -10 -10 0 -16 Z" opacity="0.75"/>
    </g>
    <g transform="translate(-115,115)" fill="#16211c">
      <g stroke="#16211c" stroke-width="2.2">
        <line x1="-14" y1="0" x2="14" y2="0"/>
        <line x1="0" y1="-14" x2="0" y2="14"/>
        <line x1="-10" y1="-10" x2="10" y2="10"/>
        <line x1="10" y1="-10" x2="-10" y2="10"/>
      </g>
    </g>

    <text y="6" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#2d3b33">4 pory roku</text>
  </g>

  <g font-family="Georgia, serif" font-size="17" fill="#16211c">
    <text x="320" y="88" text-anchor="middle">Wiosna</text>
    <text x="552" y="326" text-anchor="middle">Lato</text>
    <text x="320" y="566" text-anchor="middle">Jesień</text>
    <text x="88" y="326" text-anchor="middle">Zima</text>
  </g>
</svg>
