<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" role="img" aria-labelledby="t6 d6">
  <title id="t6">Diagram wagi kompromisu</title>
  <desc id="d6">Diagram wagi pokazujący równowagę między zapasem bezpieczeństwa a tempem ekspansji.</desc>

  <rect width="640" height="560" fill="#f5f7fa"/>

  <!-- stand -->
  <g fill="#354a60">
    <rect x="312" y="230" width="16" height="220" rx="4"/>
    <path d="M260 450 h120 l-14 30 h-92 z"/>
  </g>

  <!-- fulcrum triangle -->
  <path d="M320 230 l24 40 h-48 z" fill="#354a60"/>

  <!-- beam, tilted slightly toward left (zapas) pan being heavier -->
  <g transform="rotate(-7 320 230)">
    <rect x="90" y="224" width="460" height="10" rx="5" fill="#172a40"/>

    <!-- left pan: zapas -->
    <g transform="translate(140,224)">
      <line x1="0" y1="0" x2="0" y2="90" stroke="#172a40" stroke-width="2.5"/>
      <line x1="-46" y1="0" x2="0" y2="90" stroke="#172a40" stroke-width="2"/>
      <line x1="46" y1="0" x2="0" y2="90" stroke="#172a40" stroke-width="2"/>
      <path d="M-52 88 a54 20 0 0 0 104 0 Z" fill="#c5dcec" stroke="#245581" stroke-width="2.5"/>
      <rect x="-26" y="52" width="52" height="30" rx="4" fill="#245581"/>
    </g>

    <!-- right pan: ekspansja -->
    <g transform="translate(500,224)">
      <line x1="0" y1="0" x2="0" y2="90" stroke="#172a40" stroke-width="2.5"/>
      <line x1="-46" y1="0" x2="0" y2="90" stroke="#172a40" stroke-width="2"/>
      <line x1="46" y1="0" x2="0" y2="90" stroke="#172a40" stroke-width="2"/>
      <path d="M-52 88 a54 20 0 0 0 104 0 Z" fill="#f5dfce" stroke="#97512e" stroke-width="2.5"/>
      <path d="M-16 44 l16 -20 16 20 -10 0 0 24 -12 0 0 -24 z" fill="#97512e"/>
    </g>
  </g>

  <g font-family="Georgia, serif" font-size="17" fill="#172a40">
    <text x="140" y="356" text-anchor="middle">Zapas bezpieczeństwa</text>
    <text x="500" y="356" text-anchor="middle">Tempo ekspansji</text>
  </g>

  <!-- risk gauge -->
  <g transform="translate(320,486)">
    <path d="M-200 0 A200 200 0 0 1 200 0" fill="none" stroke="#172a40" stroke-opacity="0.15" stroke-width="14"/>
    <path d="M-200 0 A200 200 0 0 1 -20 -199" fill="none" stroke="#c5dcec" stroke-width="14"/>
    <path d="M-20 -199 A200 200 0 0 1 120 -160" fill="none" stroke="#c77446" stroke-width="14"/>
    <path d="M120 -160 A200 200 0 0 1 200 0" fill="none" stroke="#b96744" stroke-width="14"/>
    <text x="-190" y="26" font-family="Georgia, serif" font-size="13" fill="#52677c">ostrożnie</text>
    <text x="160" y="26" text-anchor="end" font-family="Georgia, serif" font-size="13" fill="#52677c">ryzykownie</text>
  </g>
</svg>
